# Canonical medical concept registry (T-0027).
#
# One entry per real clinical entity the site writes about. medical-page-schema.html
# resolves the free-text name a page passes (condition_name / procedure_name /
# device_name / therapy_name) against `name` + `aliases` here, then emits ONE
# canonical node: a stable @id, ICD-10 + MeSH `code`s, and `sameAs` grounding links.
#
# Why this exists: before this file, every page slugified whatever display name it
# happened to use, so "Uterine Prolapse" and "Pelvic Organ Prolapse" became two
# unrelated blank nodes. Now every page about the same disease points at the same
# @id, and that @id carries a code an AI system can join on (N81.4, D014596, ...).
#
# `type` is authoritative: it overrides the *_name param the page passed, so a page
# that mislabels a therapy as a condition (e.g. Vaginal Estrogen via condition_name)
# still emits the correct @type once its alias is listed here.
#
# Codes are clinical assertions on a physician's site — verify every codeValue before
# deploy. ICD-10 = ICD-10-CM. MeSH values are descriptor UIs (meshb.nlm.nih.gov).
# Omit a `codes` row rather than guess; an ungrounded canonical @id still beats a
# wrong code. `aliases` must list every spelling that appears in page frontmatter
# (see: grep -rhoP '^condition_name:' across the repo).

- id: urinary-incontinence
  type: MedicalCondition
  name: Urinary Incontinence
  aliases: [Incontinence]
  codes:
    - { system: ICD-10-CM, value: R32 }
    - { system: MeSH, value: D014549 }
  same_as:
    - https://meshb.nlm.nih.gov/record/ui?ui=D014549
    - https://en.wikipedia.org/wiki/Urinary_incontinence
    - https://medlineplus.gov/urinaryincontinence.html

