title: Ryan Stewart, DO
description: Green Bay, WI urogynecologist providing expert care for pelvic conditions, including incontinence and prolapse, with personalized treatment options.
theme: just-the-docs

url: "https://ryanstewart.com"
baseurl: ""

# Scheduling goes through the employer's booking page. Kept here so every
# CTA on the site points at one place and there is a single URL to update.
booking_url: "https://www.aurorabaycare.com/doctors/j-ryan-stewart-1922366061?patient_type=new_patient"

# Aux links for the upper right navigation
# aux_links:
#  "YouTube":
#    - "https://youtube.com"

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

footer_content: 'Copyright &copy; 2016-2026 Ryan Stewart, DO. | <a href="/privacy-policy">Privacy Policy</a><br /><em>The information provided is for educational purposes only and should not be considered medical advice. Always consult with a qualified healthcare professional for personalized medical guidance.</em>'

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

# Color scheme currently only supports "dark", "light"/nil (default), or a custom scheme that you define
color_scheme: rslight

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Post permalink structure (clean URLs without category spaces)
permalink: /blog/:title/

# Files and directories kept out of the built site.
# NOTE: setting `exclude` REPLACES Jekyll's defaults, so the default entries
# are repeated here. Anything not listed gets copied into _site and served.
exclude:
  # Jekyll defaults
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  # Repo metadata, not site content
  - README.md
  - LICENSE
  - package-lock.json
  - AGENTS.md
  - .gitattributes
  # Internal notes, tooling, and agent working files
  - pseo-review-tracker.md
  - pseo-review-pipeline/
  - scripts/
  - marketing/
  - .agents/
  - .gstack/
  - .beads/
  - DOMAIN_REDIRECT_SETUP.md
  - REDIRECT_MAPPING.md
  - faq+blog_ideas.txt
  - faq.md.bak
  - patient-readability.skill
  - GEO-AUDIT-REPORT.md
  - google_scholar_publications_2026-03-15.csv

# Plugins
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Google Analytics
ga_tracking: G-1LYFEX7C2D
ga_tracking_anonymize_ip: true